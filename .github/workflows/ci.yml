name: CI

on:
  pull_request:
  push:
    branches: [main, dev/v2-rewrite]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install -r reference/python/requirements.txt
      - run: ruff check src tests reference/python scripts/v2
      - run: ruff format --check src tests reference/python scripts/v2
      - run: python -m pytest

  native-linux:
    name: C++ engine (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-turbo8-dev liblcms2-dev
      - run: cmake -S engine -B build/engine -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/engine
      - run: ctest --test-dir build/engine --output-on-failure
      - run: ./build/engine/chromasunder_engine_benchmark --quick --output native-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-benchmark-linux
          path: native-benchmark.json

  native-sanitizers:
    name: C++ engine (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - sanitizer: ASan+UBSan
            option: CHROMASUNDER_ENABLE_SANITIZERS
            codecs: "ON"
          - sanitizer: TSan
            option: CHROMASUNDER_ENABLE_TSAN
            codecs: "OFF"
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpng-dev libjpeg-turbo8-dev liblcms2-dev
      - run: >-
          cmake -S engine -B build/engine-sanitized -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -D${{ matrix.option }}=ON -DCHROMASUNDER_ENABLE_CODECS=${{ matrix.codecs }}
          -DCHROMASUNDER_BUILD_BENCHMARKS=OFF
      - run: cmake --build build/engine-sanitized
      - run: ctest --test-dir build/engine-sanitized --output-on-failure

  windows-v2:
    name: V2 Windows smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true
      - run: flutter --version
      - run: git -C "$env:VCPKG_INSTALLATION_ROOT" fetch origin 04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4 --depth=1
      - run: cmake -S engine -B build/engine -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
      - run: cmake --build build/engine --config Release
      - run: ctest --test-dir build/engine -C Release --output-on-failure
      - working-directory: packages/chromasunder_native
        run: dart pub get
      - working-directory: packages/chromasunder_native
        run: dart run ffigen --config ffigen.yaml
      - run: git diff --exit-code -- packages/chromasunder_native/lib/chromasunder_native_bindings_generated.dart
      - working-directory: packages/chromasunder_native
        run: dart format --output=none --set-exit-if-changed hook lib test
      - working-directory: packages/chromasunder_native
        run: dart analyze
      - working-directory: packages/chromasunder_native
        run: dart test
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test
      - working-directory: app
        run: flutter analyze
      - working-directory: app
        run: flutter test
      - working-directory: app
        run: flutter build windows --release

  flatpak:
    name: Flatpak smoke build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ChromaSunder.flatpak
          manifest-path: flatpak/io.github.the_blue_blurr.ChromaSunder.yml
          cache-key: flatpak-builder-${{ github.sha }}
          arch: x86_64
          branch: stable
