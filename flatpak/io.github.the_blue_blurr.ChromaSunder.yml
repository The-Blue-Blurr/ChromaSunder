app-id: io.github.the_blue_blurr.ChromaSunder
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: chromasunder
build-options:
  env:
    PIP_DISABLE_PIP_VERSION_CHECK: '1'
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
modules:
  - name: pillow
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-cache-dir --no-deps --no-build-isolation --prefix=/app .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/af/cb/bb5c01fcd2a69335b86c22142b2bccfc3464087efb7fd382eee5ffc7fdf7/pillow-11.2.1.tar.gz
        sha256: a64dd61998416367b7ef979b73d3a85853ba9bec4c2925f74e588879a58716b6
  - name: chromasunder
    buildsystem: simple
    build-commands:
      - python3 -m pip install --no-cache-dir --no-deps --no-build-isolation --prefix=/app .
      - install -D data/io.github.the_blue_blurr.ChromaSunder.desktop /app/share/applications/io.github.the_blue_blurr.ChromaSunder.desktop
      - install -D data/io.github.the_blue_blurr.ChromaSunder.metainfo.xml /app/share/metainfo/io.github.the_blue_blurr.ChromaSunder.metainfo.xml
      - install -D data/io.github.the_blue_blurr.ChromaSunder.gschema.xml /app/share/glib-2.0/schemas/io.github.the_blue_blurr.ChromaSunder.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
      - install -D data/icons/io.github.the_blue_blurr.ChromaSunder.svg /app/share/icons/hicolor/scalable/apps/io.github.the_blue_blurr.ChromaSunder.svg
      - install -D flatpak/ChromaSunder.flatpakref /app/share/doc/chromasunder/ChromaSunder.flatpakref
      - install -D README.md /app/share/doc/chromasunder/README.md
      - install -D LICENSE /app/share/doc/chromasunder/LICENSE
      - install -D ATTRIBUTION.md /app/share/doc/chromasunder/ATTRIBUTION.md
      - install -D THIRD_PARTY_NOTICES.md /app/share/doc/chromasunder/THIRD_PARTY_NOTICES.md
    sources:
      - type: dir
        path: ..
