# Run with `dart run ffigen --config ffigen.yaml`.
name: ChromasunderNativeBindings
description: |
  Bindings for the authoritative engine C ABI.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/chromasunder_native_bindings_generated.dart'
headers:
  entry-points:
    - '../../engine/include/chromasunder/c_api.h'
  include-directives:
    - '../../engine/include/chromasunder/c_api.h'
compiler-opts:
  - '-I../../engine/include'
ffi-native:
comments:
  style: any
  length: full
